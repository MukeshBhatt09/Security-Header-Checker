<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Header Analyzer</title>

    <style>

        :root {
            --bg: #050a05;
            --bg-gradient-start: rgba(7, 20, 10, 0.96);
            --bg-gradient-end: rgba(0, 0, 0, 1);
            --panel: rgba(18, 18, 20, 0.88);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #f3fff4;
            --muted: #d4f6d9;
            --accent: #9ef7ac;
            --accent-strong: #0e7518;
            --input-bg: rgba(255, 255, 255, 0.04);
            --shadow: rgba(0, 255, 128, 0.08);
            --missing: #ef4444;
            --present: #22c55e;
        }


        body[data-theme="light"] {
            --bg: #edf5ef;
            --bg-gradient-start: rgba(228, 244, 231, 0.96);
            --bg-gradient-end: rgba(214, 233, 218, 0.96);
            --panel: rgba(255, 255, 255, 0.9);
            --panel-border: rgba(15, 23, 42, 0.08);
            --text: #102018;
            --muted: #213628;
            --accent: #0d6b2f;
            --accent-strong: #0d8f3a;
            --input-bg: rgba(12, 18, 14, 0.03);
            --shadow: rgba(41, 121, 81, 0.12);
        }


        html,
        body {
            height: 100%;
            margin: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    180deg,
                    var(--bg-gradient-start),
                    var(--bg-gradient-end)
                );
            color: var(--text);
            transition:
                background 0.25s ease,
                color 0.25s ease;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
            position: relative;
            background-attachment: fixed;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 10%, rgba(158, 247, 172, 0.22), transparent 24%),
                radial-gradient(circle at 80% 20%, rgba(96, 217, 142, 0.12), transparent 28%),
                radial-gradient(circle at 50% 80%, rgba(40, 200, 95, 0.09), transparent 30%);
            filter: blur(10px);
            animation: driftGlow 18s ease-in-out infinite alternate;
        }

        body::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
                radial-gradient(circle at center, rgba(255,255,255,0.016), transparent 70%);
            opacity: 0.75;
            mix-blend-mode: screen;
        }

        @keyframes driftGlow {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            100% {
                transform: translate3d(0, -10px, 0) scale(1.08);
            }
        }

        .page-shell {
            width: min(100%, 1120px);
            min-height: 100vh;
            text-align: center;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 28px;
            box-sizing: border-box;
            transition: justify-content 0.2s ease, padding-top 0.2s ease;
        }

        .page-shell.results-visible {
            justify-content: flex-start;
            padding-top: 26px;
        }


        .topbar {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 20;
            display: flex;
            justify-content: flex-end;
            margin: 0;
            width: auto;
        }


        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease,
                background 0.25s ease;
        }


        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.08);
        }

        .toggle-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            line-height: 1;
        }

        .theme-toggle:focus-visible,
        input:focus-visible,
        button:focus-visible,
        .raw-header-btn:focus-visible,
        .terminal-close:focus-visible {
            outline: 3px solid rgba(158, 247, 172, 0.6);
            outline-offset: 2px;
        }


        h1 {
            font-family: "Cinzel", serif;

            font-size: 56px;

            margin: 0 0 18px;

            color: var(--accent);

            letter-spacing: 0.2px;

            text-shadow:
                0 6px 18px var(--shadow);
        }


        .input-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
            margin-bottom: 12px;
        }


        input {
            width: min(100%, 420px);

            padding: 12px 14px;

            font-size: 16px;

            border-radius: 8px;

            border:
                1px solid
                var(--panel-border);

            background: var(--input-bg);

            color: var(--text);

            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus {
            border-color: rgba(158, 247, 172, 0.8);
            box-shadow: 0 0 0 4px rgba(158, 247, 172, 0.12);
        }


        input::placeholder {
            color: var(--muted);

            opacity: 0.8;
        }


        button {
            padding: 12px 20px;

            font-size: 16px;

            background:
                var(--accent-strong);

            color: white;

            border: none;

            cursor: pointer;

            border-radius: 8px;
            box-shadow: 0 10px 22px rgba(14, 117, 24, 0.2);
            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        button:hover {
            opacity: 0.96;
            transform: translateY(-1px);
            box-shadow: 0 14px 26px rgba(14, 117, 24, 0.26);
        }


        #result {
            margin-top: 30px;
            text-align: left;
            max-width: 1380px;
            width: min(100%, 1380px);
            margin-left: auto;
            margin-right: auto;
            background: transparent;
            border: none;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            transition: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 22px;
            align-items: stretch;
            width: 100%;
        }

        .analysis-panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 14px 32px var(--shadow);
            overflow: hidden;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(255,255,255,0.02);
        }

        .panel-header h2 {
            margin: 0;
        }

        .panel-content {
            padding: 16px 18px 18px;
            overflow: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            overscroll-behavior: contain;
            flex: 1;
            max-height: 620px;
        }

        .panel-content::-webkit-scrollbar {
            display: none;
        }

        .panel-content p {
            margin: 0 0 12px;
        }

        .result-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .result-header-row h2 {
            margin: 0;
        }

        .raw-header-btn {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .ai-analysis .panel-content {
            padding-top: 12px;
            font-size: 0.95rem;
            line-height: 1.55;
        }

        .ai-analysis .panel-content h1,
        .ai-analysis .panel-content h2,
        .ai-analysis .panel-content h3 {
            margin: 0 0 10px;
            font-size: 1rem;
            line-height: 1.4;
            color: var(--text);
        }

        .ai-analysis .panel-content p,
        .ai-analysis .panel-content li {
            margin: 0 0 8px;
        }

        .ai-analysis .panel-content ul,
        .ai-analysis .panel-content ol {
            margin: 8px 0 12px 18px;
            padding-left: 0;
        }

        .ai-analysis .panel-content strong {
            color: var(--text);
        }

        .raw-header-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(158, 247, 172, 0.7);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        }

        .missing {
            color: var(--missing);
        }


        .present {
            color: var(--present);
        }


        .modal-backdrop {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-backdrop.visible {
            display: flex;
            opacity: 1;
        }

        .terminal-modal {
            width: min(90vw, 900px);
            max-height: 80vh;
            background: #0d1117;
            color: #d8fce5;
            border: 1px solid rgba(122, 255, 170, 0.35);
            border-radius: 12px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            transform: translateY(10px) scale(0.985);
            transition: transform 0.2s ease;
        }

        .modal-backdrop.visible .terminal-modal {
            transform: translateY(0) scale(1);
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(122, 255, 170, 0.18);
            font-family: Consolas, monospace;
            font-size: 0.9rem;
        }

        .terminal-window-controls {
            display: flex;
            gap: 8px;
        }

        .terminal-window-controls span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .terminal-window-controls span:nth-child(1) { background: #ff5f57; }
        .terminal-window-controls span:nth-child(2) { background: #febc2e; }
        .terminal-window-controls span:nth-child(3) { background: #28c840; }

        .terminal-close {
            background: transparent;
            border: none;
            color: #d8fce5;
            cursor: pointer;
            font-size: 1.3rem;
            line-height: 1;
        }

        .terminal-body {
            margin: 0;
            padding: 18px 18px 22px;
            max-height: 65vh;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            background: linear-gradient(180deg, rgba(13,17,23,0.98), rgba(8,12,18,0.98));
        }


        /* =====================================================
           NEW RESULT STYLES
           ===================================================== */


        .extended-results {
            margin-top: 20px;
        }


        .score-row {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin:
                15px 0 25px;
        }


        .score-card {
            padding: 12px;

            text-align: center;

            border:
                1px solid
                var(--panel-border);

            border-radius: 8px;

            background:
                var(--input-bg);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .score-card:hover {
            transform: translateY(-2px);
            border-color: rgba(158, 247, 172, 0.5);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.08);
        }


        .score-card strong {
            display: block;

            font-size: 1.3rem;

            margin-bottom: 4px;
        }


        .score-card span {
            color: var(--muted);

            font-size: 12px;
        }


        .weak {
            color: #f59e0b;
        }


        .header-item {
            padding: 12px 0;

            border-bottom:
                1px solid
                var(--panel-border);
        }


        .header-item small {
            display: block;

            color: var(--muted);

            margin-top: 4px;
        }


        .header-value {
            margin-top: 7px;

            padding: 8px;

            border-radius: 6px;

            background: var(--input-bg);

            font-family:
                Consolas,
                monospace;

            font-size: 13px;

            word-break: break-word;
        }


        .recommendation {
            margin-top: 7px;

            color: var(--muted);

            font-size: 13px;
        }


        .response-info {
            padding: 5px 0;
        }


        .response-info p {
            margin: 8px 0;

            word-break: break-word;
        }


        @media (max-width: 640px) {

            body {
                padding-top: 24px;
            }


            .topbar {
                justify-content: center;

                margin-bottom: 10px;
            }


            .input-row {
                flex-direction: row;
                align-items: center;
            }


            input {
                width: min(100%, 420px);
            }

            button {
                width: auto;
            }


            .score-row {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .analysis-panel {
                min-height: 320px;
            }

        }

    </style>
</head>


<body data-theme="dark">

    <div class="page-shell">

        <header class="topbar">

            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
                aria-label="Switch to light mode"
                title="Toggle theme"
            >
                <span
                    class="toggle-icon"
                    aria-hidden="true"
                >☀️</span>
            </button>

        </header>


        <h1>
            SECURITY HEADER ANALYZER
        </h1>


        <div class="input-row">

            <input
                type="text"
                id="urlInput"
                placeholder="Enter https://example.com"
            >

            <button onclick="analyze()">
                Analyze
            </button>

        </div>


        <div id="result"></div>

    </div>

    <div id="rawHeadersModal" class="modal-backdrop" aria-hidden="true">
        <div class="terminal-modal" role="dialog" aria-modal="true" aria-labelledby="rawHeadersTitle">
            <div class="terminal-header">
                <div class="terminal-window-controls">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <strong id="rawHeadersTitle">HTTP Response Headers</strong>
                <button class="terminal-close" type="button" aria-label="Close raw headers">×</button>
            </div>
            <pre id="rawHeadersContent" class="terminal-body"></pre>
        </div>
    </div>

    <script
        type="module"
        src="/static/script.js"
    ></script>

</body>
</html>
